AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: tinder-bgg backend (API Gateway + Lambda + DynamoDB)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]{0,15}$'
    Description: Deployment stage, used in resource and parameter names.
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origin allowed by CORS (the CloudFront domain once hosted, #13).
  BggTokenParameterName:
    Type: String
    Default: /tinder-bgg/dev/bgg-token
    Description: Name of the SSM SecureString parameter holding the BGG API token (#10).

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        BGG_TOKEN_PARAMETER: !Ref BggTokenParameterName
        NODE_OPTIONS: --enable-source-maps

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
        MaxAge: 600

  # Single table for every entity; see docs/data-model.md.
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Unauthenticated liveness check. It needs no table access, so it gets no
  # policies. Give each function its own least-privilege policy (for example
  # DynamoDBReadPolicy or DynamoDBCrudPolicy on !Ref Table) when it needs data.
  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/health.ts]
        OutExtension:
          - .js=.mjs
    Properties:
      Handler: health.handler
      CodeUri: src/
      Description: GET /health
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /health

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  TableName:
    Description: DynamoDB table name
    Value: !Ref Table
